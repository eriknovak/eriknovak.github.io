name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # this workflow will update the homepage on
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build on production
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}
          script: |
            cd ../../var/www/homepage
            nvm use lts/hydrogen
            git pull
            rm -rf node_modules
            npm ci
            npm install -g next
            BASE_PATH=/eriknovak npm run build
