name: CI

on:
  push:
    branches: [master]

# Serialise deploys: two quick pushes must not run on the server at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # this workflow will update the homepage on
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build on production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}
          script: |
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd /var/www/homepage
            git pull --ff-only
            nvm use
            npm ci --no-audit --no-fund
            BASE_PATH=/eriknovak npm run build

  # Static export served at the root of https://eriknovak.github.io
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          BASE_PATH: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
