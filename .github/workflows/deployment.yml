name: CI

on:
  push:
    branches: [master]

# Serialise deploys: two quick pushes must not run on the server at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # this workflow will update the homepage on
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build on production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}
          script: |
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            cd /var/www/homepage
            git pull --ff-only
            nvm use
            npm ci --no-audit --no-fund
            BASE_PATH=/eriknovak npm run build
